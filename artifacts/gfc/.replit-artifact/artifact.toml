kind = "web"
previewPath = "/gfc/"
title = "Global Football Capital"
version = "1.0.0"
id = "artifacts/gfc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/gfc/" ]
localPort = 19039

[services.development]
run = "pnpm --filter @workspace/gfc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gfc", "run", "build" ]
publicDir = "artifacts/gfc/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19039"
BASE_PATH = "/gfc/"
