openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Global Football Capital — multi-player football economy platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: clubs
  - name: leagues
  - name: players
  - name: contracts
  - name: transfers
  - name: economy
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth / Profile ────────────────────────────────────────────────────────
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create account with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register user (pick role and display name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Leagues ───────────────────────────────────────────────────────────────
  /leagues:
    get:
      operationId: listLeagues
      tags: [leagues]
      summary: List all leagues with entry cost and prize pools
      responses:
        "200":
          description: Leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"

  /leagues/{id}:
    get:
      operationId: getLeague
      tags: [leagues]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: League
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueDetail"

  /leagues/{id}/standings:
    get:
      operationId: getLeagueStandings
      tags: [leagues]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Standings table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StandingRow"

  # ── Clubs ─────────────────────────────────────────────────────────────────
  /clubs:
    get:
      operationId: listClubs
      tags: [clubs]
      summary: Browse all clubs
      parameters:
        - name: leagueId
          in: query
          schema:
            type: integer
        - name: available
          in: query
          description: Only clubs without an owner
          schema:
            type: boolean
      responses:
        "200":
          description: Clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"

  /clubs/{id}:
    get:
      operationId: getClub
      tags: [clubs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"

  /clubs/{id}/buy:
    post:
      operationId: buyClub
      tags: [clubs]
      summary: Owner purchases a club (costs GFC coins)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club acquired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"
        "400":
          description: Insufficient funds or already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clubs/{id}/hire-coach:
    post:
      operationId: hireCoach
      tags: [clubs]
      summary: Owner hires a coach for their club
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HireCoachInput"
      responses:
        "200":
          description: Coach hired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clubs/{id}/fire-coach:
    post:
      operationId: fireCoach
      tags: [clubs]
      summary: Owner fires the current coach (penalty applies)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coach fired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"

  /clubs/{id}/upgrade:
    post:
      operationId: upgradeClub
      tags: [clubs]
      summary: Owner upgrades infrastructure (stadium, academy, training)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeInput"
      responses:
        "200":
          description: Upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clubs/my:
    get:
      operationId: getMyClub
      tags: [clubs]
      summary: Get the club the current user owns or coaches
      responses:
        "200":
          description: My club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"
        "404":
          description: No club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Players ───────────────────────────────────────────────────────────────
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: Browse free agents and listed players
      parameters:
        - name: clubId
          in: query
          schema:
            type: integer
        - name: freeAgent
          in: query
          schema:
            type: boolean
        - name: position
          in: query
          schema:
            type: string
        - name: maxAge
          in: query
          schema:
            type: integer
        - name: minOverall
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  # ── Contracts ─────────────────────────────────────────────────────────────
  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List all contracts for my club
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"

  /contracts/coach-offers:
    get:
      operationId: listCoachOffers
      tags: [contracts]
      summary: Coach sees incoming job offers from owners
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachOffer"

  /contracts/coach-offers/{id}/respond:
    post:
      operationId: respondToCoachOffer
      tags: [contracts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferResponseInput"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachOffer"

  /contracts/player:
    post:
      operationId: signPlayerContract
      tags: [contracts]
      summary: Sign a player (coach action)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerContractInput"
      responses:
        "201":
          description: Signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contracts/{id}/terminate:
    post:
      operationId: terminateContract
      tags: [contracts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Terminated (buyout deducted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Transfers ─────────────────────────────────────────────────────────────
  /transfers/market:
    get:
      operationId: getTransferMarket
      tags: [transfers]
      summary: Browse listed players on transfer market
      parameters:
        - name: position
          in: query
          schema:
            type: string
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: leagueId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Market listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferListing"

  /transfers/bid:
    post:
      operationId: placeBid
      tags: [transfers]
      summary: Coach bids for a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidInput"
      responses:
        "200":
          description: Bid placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferBid"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transfers/list-player:
    post:
      operationId: listPlayerForTransfer
      tags: [transfers]
      summary: Coach lists a player for transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListPlayerInput"
      responses:
        "200":
          description: Listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferListing"

  /transfers/history:
    get:
      operationId: getTransferHistory
      tags: [transfers]
      summary: Recent transfers across all clubs
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferRecord"

  # ── Economy ───────────────────────────────────────────────────────────────
  /economy/summary:
    get:
      operationId: getEconomySummary
      tags: [economy]
      summary: Platform-wide economic snapshot (total money, transactions, tax pool)
      responses:
        "200":
          description: Economy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomySummary"

  /economy/my-finances:
    get:
      operationId: getMyFinances
      tags: [economy]
      summary: Current user's wallet and recent transactions
      responses:
        "200":
          description: Finances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyFinances"

  /economy/transactions:
    get:
      operationId: listTransactions
      tags: [economy]
      summary: My transaction history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Role-aware dashboard — summary stats for owner or coach
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /dashboard/activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [dashboard]
      summary: Top owners by club value, top coaches by win rate
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"

  # ── Football Manager Paths ───────────────────────────────────────────────
  /game/state:
    get:
      operationId: getGameState
      tags: [health]
      summary: Get current game state
      responses:
        "200":
          description: Game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"

  /game/clubs:
    get:
      operationId: fmListClubs
      tags: [health]
      summary: List all clubs available for selection
      responses:
        "200":
          description: List of clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FmClub"

  /game/setup:
    post:
      operationId: setupGame
      tags: [health]
      summary: Start a new game with a selected club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupGameInput"
      responses:
        "201":
          description: Game started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"

  /game/advance:
    post:
      operationId: advanceGame
      tags: [health]
      summary: Advance game by one week
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"

  /squad:
    get:
      operationId: getSquad
      tags: [health]
      summary: Get the player's club squad
      responses:
        "200":
          description: Squad players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FmPlayer"

  /tactics:
    get:
      operationId: getTactics
      tags: [health]
      summary: Get current tactics
      responses:
        "200":
          description: Tactics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tactics"
    put:
      operationId: updateTactics
      tags: [health]
      summary: Update tactics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTacticsInput"
      responses:
        "200":
          description: Updated tactics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tactics"

  /training:
    get:
      operationId: getTrainingSchedule
      tags: [health]
      summary: Get training schedule
      responses:
        "200":
          description: Training schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSchedule"
    put:
      operationId: updateTrainingSchedule
      tags: [health]
      summary: Update training schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingSchedule"
      responses:
        "200":
          description: Updated training schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSchedule"

  /training/individual:
    get:
      operationId: getIndividualTraining
      tags: [health]
      summary: Get individual player training assignments
      responses:
        "200":
          description: Individual training
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndividualTraining"
    put:
      operationId: updateIndividualTraining
      tags: [health]
      summary: Update individual player training
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      playerId:
                        type: integer
                      focus:
                        type: ["string", "null"]
                    required: [playerId]
              required: [assignments]
      responses:
        "200":
          description: Updated individual training
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndividualTraining"

  /fixtures:
    get:
      operationId: listFixtures
      tags: [health]
      summary: List fixtures
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Fixtures list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fixture"

  /fixtures/{id}:
    get:
      operationId: getFixture
      tags: [health]
      summary: Get fixture details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fixture detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixtureDetail"

  /fixtures/{id}/simulate:
    post:
      operationId: simulateMatch
      tags: [health]
      summary: Simulate a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixtureDetail"

  /fixtures/{id}/live:
    get:
      operationId: getLiveMatch
      tags: [health]
      summary: Get live match data with commentary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveMatch"

  /fixtures/{id}/detail:
    get:
      operationId: getFixtureDetail
      tags: [health]
      summary: Get fixture with commentary and player ratings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fixture full detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveMatch"

  /fm/transfers/market:
    get:
      operationId: fmGetTransferMarket
      tags: [health]
      summary: Get transfer market listings
      parameters:
        - name: position
          in: query
          required: false
          schema:
            type: string
        - name: maxValue
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Transfer market players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferMarketPlayer"

  /fm/transfers/offer:
    post:
      operationId: makeTransferOffer
      tags: [health]
      summary: Make a transfer offer for a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOfferInput"
      responses:
        "200":
          description: Transfer offer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferOfferResult"

  /fm/transfers:
    get:
      operationId: listTransfers
      tags: [health]
      summary: List completed transfers for the player's club
      responses:
        "200":
          description: Transfer history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FmTransfer"

  /staff:
    get:
      operationId: getStaff
      tags: [health]
      summary: Get hired staff
      responses:
        "200":
          description: Hired staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /staff/market:
    get:
      operationId: getStaffMarket
      tags: [health]
      summary: Get available staff for hire
      responses:
        "200":
          description: Available staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /staff/hire:
    post:
      operationId: hireStaff
      tags: [health]
      summary: Hire a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                staffId:
                  type: integer
              required: [staffId]
      responses:
        "200":
          description: Hired staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /inbox:
    get:
      operationId: listInboxMessages
      tags: [health]
      summary: Get inbox messages
      responses:
        "200":
          description: Inbox messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxMessage"

  /inbox/{id}/read:
    post:
      operationId: markMessageRead
      tags: [health]
      summary: Mark a message as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessage"

  /shortlist:
    get:
      operationId: getShortlist
      tags: [health]
      summary: Get scouting shortlist
      responses:
        "200":
          description: Shortlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShortlistEntry"
    post:
      operationId: addToShortlist
      tags: [health]
      summary: Add player to shortlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playerId:
                  type: integer
              required: [playerId]
      responses:
        "200":
          description: Added entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortlistEntry"

  /shortlist/{playerId}:
    delete:
      operationId: removeFromShortlist
      tags: [health]
      summary: Remove player from shortlist
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
