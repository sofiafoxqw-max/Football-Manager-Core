        clubId:
          type: ["integer", "null"]
        clubName:
          type: ["string", "null"]
        leagueName:
          type: ["string", "null"]
        leaguePosition:
          type: ["integer", "null"]
        points:
          type: ["integer", "null"]
        clubValue:
          type: ["integer", "null"]
        transferBudget:
          type: ["integer", "null"]
        squadSize:
          type: ["integer", "null"]
        weeklyWageBill:
          type: ["integer", "null"]
        pendingOffers:
          type: integer
        hasClub:
          type: boolean
      required: [role, displayName, balance, reputation, pendingOffers, hasClub]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
