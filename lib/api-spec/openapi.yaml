components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    # ── Users ───────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, coach, unregistered]
        balance:
          type: integer
          description: GFC coins
        reputation:
          type: integer
        clubId:
          type: ["integer", "null"]
        clubName:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, email, displayName, role, balance, reputation, createdAt]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [token, user]

    SignupInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    RegisterInput:
      type: object
      properties:
        displayName:
          type: string
        role:
          type: string
          enum: [owner, coach]
      required: [displayName, role]

    # ── Leagues ─────────────────────────────────────────────────────────────
    League:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        tier:
          type: integer
        entryFee:
          type: integer
          description: Cost in GFC coins for owner to join
        prizePool:
          type: integer
        totalClubs:
          type: integer
        activeOwners:
          type: integer
      required: [id, name, country, tier, entryFee, prizePool, totalClubs, activeOwners]

    LeagueDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        tier:
          type: integer
        entryFee:
          type: integer
        prizePool:
          type: integer
        season:
          type: integer
        currentWeek:
          type: integer
        totalWeeks:
          type: integer
        clubs:
          type: array
          items:
            $ref: "#/components/schemas/Club"
      required: [id, name, country, tier, entryFee, prizePool, season, currentWeek, totalWeeks, clubs]

    StandingRow:
      type: object
      properties:
        position:
          type: integer
        clubId:
          type: integer
        clubName:
          type: string
        ownerName:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]
        played:
          type: integer
        won:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goalsFor:
          type: integer
        goalsAgainst:
          type: integer
        points:
          type: integer
      required: [position, clubId, clubName, played, won, drawn, lost, goalsFor, goalsAgainst, points]

    # ── Clubs ───────────────────────────────────────────────────────────────
    Club:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        leagueId:
          type: integer
        leagueName:
          type: string
        country:
          type: string
        city:
          type: string
        colors:
          type: string
        purchasePrice:
          type: integer
        currentValue:
          type: integer
        prestige:
          type: integer
        ownerId:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        coachId:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]
        stadiumLevel:
          type: integer
        academyLevel:
          type: integer
        trainingLevel:
          type: integer
        transferBudget:
          type: integer
        weeklyWageBill:
          type: integer
      required: [id, name, leagueId, leagueName, country, city, colors, purchasePrice, currentValue, prestige, stadiumLevel, academyLevel, trainingLevel, transferBudget, weeklyWageBill]

    ClubDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        leagueId:
          type: integer
        leagueName:
          type: string
        country:
          type: string
        city:
          type: string
        colors:
          type: string
        purchasePrice:
          type: integer
        currentValue:
          type: integer
        prestige:
          type: integer
        ownerId:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        coachId:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]
        stadiumLevel:
          type: integer
        academyLevel:
          type: integer
        trainingLevel:
          type: integer
        transferBudget:
          type: integer
        weeklyWageBill:
          type: integer
        stadiumName:
          type: string
        stadiumCapacity:
          type: integer
        description:
          type: string
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        coachSalary:
          type: ["integer", "null"]
        coachContractWeeks:
          type: ["integer", "null"]
      required: [id, name, leagueId, leagueName, country, city, colors, purchasePrice, currentValue, prestige, stadiumLevel, academyLevel, trainingLevel, transferBudget, weeklyWageBill, stadiumName, stadiumCapacity, description, players]

    UpgradeInput:
      type: object
      properties:
        upgradeType:
          type: string
          enum: [stadium, academy, training]
      required: [upgradeType]

    HireCoachInput:
      type: object
      properties:
        coachUserId:
          type: string
        weeklySalary:
          type: integer
        contractWeeks:
          type: integer
        bonusPerWin:
          type: integer
      required: [coachUserId, weeklySalary, contractWeeks, bonusPerWin]

    # ── Players ─────────────────────────────────────────────────────────────
    Player:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        nationality:
          type: string
        position:
          type: string
        overall:
          type: integer
        potential:
          type: integer
        pace:
          type: integer
        shooting:
          type: integer
        passing:
          type: integer
        dribbling:
          type: integer
        defending:
          type: integer
        physicality:
          type: integer
        value:
          type: integer
        weeklySalary:
          type: integer
        contractEndsWeek:
          type: ["integer", "null"]
        clubId:
          type: ["integer", "null"]
        clubName:
          type: ["string", "null"]
        isOnTransferList:
          type: boolean
        isFreeAgent:
          type: boolean
      required: [id, name, age, nationality, position, overall, potential, pace, shooting, passing, dribbling, defending, physicality, value, weeklySalary, isOnTransferList, isFreeAgent]

    # ── Contracts ───────────────────────────────────────────────────────────
    Contract:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [player, coach]
        playerId:
          type: ["integer", "null"]
        playerName:
          type: ["string", "null"]
        coachId:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]
        clubId:
          type: integer
        clubName:
          type: string
        weeklySalary:
          type: integer
        startWeek:
          type: integer
        endWeek:
          type: integer
        buyoutClause:
          type: integer
        status:
          type: string
          enum: [active, expired, terminated]
      required: [id, type, clubId, clubName, weeklySalary, startWeek, endWeek, buyoutClause, status]

    PlayerContractInput:
      type: object
      properties:
        playerId:
          type: integer
        weeklySalary:
          type: integer
        contractWeeks:
          type: integer
      required: [playerId, weeklySalary, contractWeeks]

    CoachOffer:
      type: object
      properties:
        id:
          type: integer
        ownerName:
          type: string
        clubId:
          type: integer
        clubName:
          type: string
        leagueName:
          type: string
        weeklySalary:
          type: integer
        contractWeeks:
          type: integer
        bonusPerWin:
          type: integer
        status:
          type: string
          enum: [pending, accepted, rejected]
        createdAt:
          type: string
      required: [id, ownerName, clubId, clubName, leagueName, weeklySalary, contractWeeks, bonusPerWin, status, createdAt]

    OfferResponseInput:
      type: object
      properties:
        accept:
          type: boolean
      required: [accept]

    # ── Transfers ───────────────────────────────────────────────────────────
    TransferListing:
      type: object
      properties:
        id:
          type: integer
        playerId:
          type: integer
        playerName:
          type: string
        position:
          type: string
        overall:
          type: integer
        age:
          type: integer
        fromClubId:
          type: integer
        fromClubName:
          type: string
        askingPrice:
          type: integer
        listedAt:
          type: string
      required: [id, playerId, playerName, position, overall, age, fromClubId, fromClubName, askingPrice, listedAt]

    BidInput:
      type: object
      properties:
        listingId:
          type: integer
        bidAmount:
          type: integer
      required: [listingId, bidAmount]

    TransferBid:
      type: object
      properties:
        id:
          type: integer
        listingId:
          type: integer
        playerName:
          type: string
        bidAmount:
          type: integer
        status:
          type: string
          enum: [pending, accepted, rejected]
        taxAmount:
          type: integer
      required: [id, listingId, playerName, bidAmount, status, taxAmount]

    ListPlayerInput:
      type: object
      properties:
        playerId:
          type: integer
        askingPrice:
          type: integer
      required: [playerId, askingPrice]

    TransferRecord:
      type: object
      properties:
        id:
          type: integer
        playerName:
          type: string
        fromClubName:
          type: string
        toClubName:
          type: string
        fee:
          type: integer
        taxPaid:
          type: integer
        completedAt:
          type: string
      required: [id, playerName, fromClubName, toClubName, fee, taxPaid, completedAt]

    # ── Economy ─────────────────────────────────────────────────────────────
    EconomySummary:
      type: object
      properties:
        totalMoneyInCirculation:
          type: integer
        taxPoolBalance:
          type: integer
        totalTransfersThisSeason:
          type: integer
        totalTransferVolume:
          type: integer
        activeOwners:
          type: integer
        activeCoaches:
          type: integer
        totalClubs:
          type: integer
        taxRate:
          type: number
      required: [totalMoneyInCirculation, taxPoolBalance, totalTransfersThisSeason, totalTransferVolume, activeOwners, activeCoaches, totalClubs, taxRate]

    MyFinances:
      type: object
      properties:
        balance:
          type: integer
        weeklyIncome:
          type: integer
        weeklyExpenses:
          type: integer
        totalEarned:
          type: integer
        totalSpent:
          type: integer
        clubValue:
          type: ["integer", "null"]
        prizeMoneyEarned:
          type: integer
      required: [balance, weeklyIncome, weeklyExpenses, totalEarned, totalSpent, prizeMoneyEarned]

    Transaction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [transfer_fee, salary, prize_money, club_purchase, upgrade, tax, bonus]
        amount:
          type: integer
        description:
          type: string
        createdAt:
          type: string
      required: [id, type, amount, description, createdAt]

