openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Football Manager 26 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: game
  - name: squad
  - name: tactics
  - name: fixtures
  - name: league
  - name: transfers
  - name: inbox
  - name: finances
  - name: training
  - name: injuries
  - name: scouting
  - name: contracts
  - name: setpieces
  - name: staff
  - name: matchday
  - name: pressconf
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /game/state:
    get:
      operationId: getGameState
      tags: [game]
      responses:
        "200":
          description: Current game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /game/setup:
    post:
      operationId: setupGame
      tags: [game]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSetupInput"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"

  /game/advance:
    post:
      operationId: advanceGame
      tags: [game]
      responses:
        "200":
          description: Advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"

  /game/clubs:
    get:
      operationId: listClubs
      tags: [game]
      responses:
        "200":
          description: All clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"

  /squad:
    get:
      operationId: getSquad
      tags: [squad]
      responses:
        "200":
          description: Squad
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [squad]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/{id}/transfer-list:
    post:
      operationId: toggleTransferList
      tags: [squad]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferListToggleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /tactics:
    get:
      operationId: getTactics
      tags: [tactics]
      responses:
        "200":
          description: Tactics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tactics"
    put:
      operationId: updateTactics
      tags: [tactics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TacticsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tactics"

  /fixtures:
    get:
      operationId: listFixtures
      tags: [fixtures]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, completed]
      responses:
        "200":
          description: Fixtures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fixture"

  /fixtures/{id}:
    get:
      operationId: getFixture
      tags: [fixtures]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fixture detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixtureDetail"

  /fixtures/{id}/simulate:
    post:
      operationId: simulateMatch
      tags: [fixtures]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixtureDetail"

  /fixtures/{id}/live:
    get:
      operationId: getLiveMatch
      tags: [matchday]
      summary: Get live match simulation with commentary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live match data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveMatch"

  /league:
    get:
      operationId: getLeagueStandings
      tags: [league]
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueTable"

  /stats/season:
    get:
      operationId: getSeasonStats
      tags: [league]
      responses:
        "200":
          description: Season stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonStats"

  /transfers/market:
    get:
      operationId: getTransferMarket
      tags: [transfers]
      parameters:
        - name: position
          in: query
          schema:
            type: string
        - name: maxValue
          in: query
          schema:
            type: integer
        - name: minOverall
          in: query
          schema:
            type: integer
        - name: maxAge
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Market
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferListing"

  /transfers/offer:
    post:
      operationId: makeTransferOffer
      tags: [transfers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOfferInput"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"

  /transfers:
    get:
      operationId: listTransfers
      tags: [transfers]
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"

  /inbox:
    get:
      operationId: listInboxMessages
      tags: [inbox]
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxMessage"

  /inbox/{id}/read:
    post:
      operationId: markMessageRead
      tags: [inbox]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessage"

  /finances:
    get:
      operationId: getFinances
      tags: [finances]
      responses:
        "200":
          description: Finances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finances"

  /training:
    get:
      operationId: getTrainingSchedule
      tags: [training]
      responses:
        "200":
          description: Training schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSchedule"
    put:
      operationId: updateTrainingSchedule
      tags: [training]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingScheduleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSchedule"

  /training/individual:
    get:
      operationId: getIndividualTraining
      tags: [training]
      responses:
        "200":
          description: Individual training assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndividualTraining"
    put:
      operationId: updateIndividualTraining
      tags: [training]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualTrainingInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndividualTraining"

  /injuries:
    get:
      operationId: listInjuries
      tags: [injuries]
      responses:
        "200":
          description: Injured players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Injury"

  /shortlist:
    get:
      operationId: getShortlist
      tags: [scouting]
      responses:
        "200":
          description: Shortlisted players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShortlistEntry"
    post:
      operationId: addToShortlist
      tags: [scouting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortlistInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortlistEntry"

  /shortlist/{playerId}:
    delete:
      operationId: removeFromShortlist
      tags: [scouting]
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /scouts/search:
    post:
      operationId: scoutSearch
      tags: [scouting]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoutSearchInput"
      responses:
        "200":
          description: Scout results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoutReport"

  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      responses:
        "200":
          description: Expiring contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractSummary"

  /contracts/{playerId}/offer:
    post:
      operationId: offerContractRenewal
      tags: [contracts]
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractOfferInput"
      responses:
        "200":
          description: Contract result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractResult"

  /set-pieces:
    get:
      operationId: getSetPieces
      tags: [setpieces]
      responses:
        "200":
          description: Set piece instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPieces"
    put:
      operationId: updateSetPieces
      tags: [setpieces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPiecesInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPieces"

  /staff:
    get:
      operationId: getStaff
      tags: [staff]
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /staff/market:
    get:
      operationId: getStaffMarket
      tags: [staff]
      responses:
        "200":
          description: Available staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /staff/hire:
    post:
      operationId: hireStaff
      tags: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HireStaffInput"
      responses:
        "200":
          description: Hired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /press-conference:
    get:
      operationId: getPressConference
      tags: [pressconf]
      responses:
        "200":
          description: Current press conference questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PressConference"

  /press-conference/answer:
    post:
      operationId: answerPressConference
      tags: [pressconf]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressAnswerInput"
      responses:
        "200":
          description: Morale effect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PressAnswerResult"

  /team-talk:
    post:
      operationId: giveTeamTalk
      tags: [matchday]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamTalkInput"
      responses:
        "200":
          description: Team talk result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTalkResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    GameState:
      type: object
      properties:
        started:
          type: boolean
        clubId:
          type: ["integer", "null"]
        clubName:
          type: ["string", "null"]
        managerName:
          type: ["string", "null"]
        leagueName:
          type: ["string", "null"]
        currentDate:
          type: ["string", "null"]
        currentWeek:
          type: ["integer", "null"]
        totalWeeks:
          type: ["integer", "null"]
        season:
          type: ["integer", "null"]
        leaguePosition:
          type: ["integer", "null"]
        points:
          type: ["integer", "null"]
        nextFixtureId:
          type: ["integer", "null"]
        nextFixtureOpponent:
          type: ["string", "null"]
        nextFixtureDate:
          type: ["string", "null"]
        nextFixtureIsHome:
          type: ["boolean", "null"]
        unreadMessages:
          type: integer
        transferBudget:
          type: ["integer", "null"]
        injuredCount:
          type: integer
        morale:
          type: string
      required: [started, unreadMessages, morale, injuredCount]

    GameSetupInput:
      type: object
      properties:
        clubId:
          type: integer
        managerName:
          type: string
      required: [clubId, managerName]

    Club:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        country:
          type: string
        leagueName:
          type: string
        reputation:
          type: integer
        budget:
          type: integer
        stadiumName:
          type: string
        stadiumCapacity:
          type: integer
        colors:
          type: string
        description:
          type: string
      required: [id, name, city, country, leagueName, reputation, budget, stadiumName, stadiumCapacity, colors, description]

    PlayerAttributes:
      type: object
      properties:
        pace:
          type: integer
        shooting:
          type: integer
        passing:
          type: integer
        dribbling:
          type: integer
        defending:
          type: integer
        physicality:
          type: integer
        goalkeeping:
          type: integer
      required: [pace, shooting, passing, dribbling, defending, physicality, goalkeeping]

    Player:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        nationality:
          type: string
        position:
          type: string
        preferredFoot:
          type: string
          enum: [left, right, both]
        overall:
          type: integer
        potential:
          type: integer
        attributes:
          $ref: "#/components/schemas/PlayerAttributes"
        form:
          type: integer
        fitness:
          type: integer
        morale:
          type: string
        value:
          type: integer
        weeklySalary:
          type: integer
        contractEndsYear:
          type: integer
        seasonGoals:
          type: integer
        seasonAssists:
          type: integer
        seasonAppearances:
          type: integer
        clubId:
          type: integer
        isOnTransferList:
          type: boolean
        isInjured:
          type: boolean
        injuryWeeksLeft:
          type: integer
        injuryType:
          type: ["string", "null"]
        role:
          type: string
          description: Player tactical role
        trainingFocus:
          type: ["string", "null"]
        playerDescription:
          type: string
      required: [id, name, age, nationality, position, preferredFoot, overall, potential, attributes, form, fitness, morale, value, weeklySalary, contractEndsYear, seasonGoals, seasonAssists, seasonAppearances, clubId, isOnTransferList, isInjured, injuryWeeksLeft, role, playerDescription]

    TransferListToggleInput:
      type: object
      properties:
        listed:
          type: boolean
      required: [listed]

    Tactics:
      type: object
      properties:
        formation:
          type: string
          enum: ["4-3-3", "4-4-2", "4-2-3-1", "3-5-2", "5-3-2", "4-5-1", "3-4-3", "4-1-4-1", "5-4-1"]
        mentality:
          type: string
          enum: [defensive, balanced, attacking, gegenpressing, counter, possession]
        pressing:
          type: integer
        tempo:
          type: integer
        width:
          type: integer
        defensiveLine:
          type: integer
        captainId:
          type: ["integer", "null"]
        viceCaptainId:
          type: ["integer", "null"]
        penaltyTakerId:
          type: ["integer", "null"]
        startingXI:
          type: array
          items:
            $ref: "#/components/schemas/TacticSlot"
        instructions:
          type: array
          items:
            $ref: "#/components/schemas/PlayerInstruction"
      required: [formation, mentality, pressing, tempo, width, defensiveLine, startingXI, instructions]

    TacticSlot:
      type: object
      properties:
        slot:
          type: integer
        position:
          type: string
        playerId:
          type: ["integer", "null"]
        playerName:
          type: ["string", "null"]
        playerOverall:
          type: ["integer", "null"]
        role:
          type: ["string", "null"]
      required: [slot, position]

    PlayerInstruction:
      type: object
      properties:
        playerId:
          type: integer
        role:
          type: string
        duty:
          type: string
          enum: [defend, support, attack]
        specificInstruction:
          type: ["string", "null"]
      required: [playerId, role, duty]

    TacticsInput:
      type: object
      properties:
        formation:
          type: string
          enum: ["4-3-3", "4-4-2", "4-2-3-1", "3-5-2", "5-3-2", "4-5-1", "3-4-3", "4-1-4-1", "5-4-1"]
        mentality:
          type: string
          enum: [defensive, balanced, attacking, gegenpressing, counter, possession]
        pressing:
          type: integer
        tempo:
          type: integer
        width:
          type: integer
        defensiveLine:
          type: integer
        captainId:
          type: ["integer", "null"]
        viceCaptainId:
          type: ["integer", "null"]
        penaltyTakerId:
          type: ["integer", "null"]
        startingXI:
          type: array
          items:
            $ref: "#/components/schemas/TacticSlot"
        instructions:
          type: array
          items:
            $ref: "#/components/schemas/PlayerInstruction"
      required: [formation, mentality, pressing, tempo, width, defensiveLine, startingXI, instructions]

    Fixture:
      type: object
      properties:
        id:
          type: integer
        week:
          type: integer
        date:
          type: string
        homeClubId:
          type: integer
        homeClubName:
          type: string
        awayClubId:
          type: integer
        awayClubName:
          type: string
        status:
          type: string
          enum: [scheduled, completed, live]
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        isPlayerClubHome:
          type: boolean
        isPlayerClubAway:
          type: boolean
        competition:
          type: string
      required: [id, week, date, homeClubId, homeClubName, awayClubId, awayClubName, status, isPlayerClubHome, isPlayerClubAway, competition]

    CommentaryLine:
      type: object
      properties:
        minute:
          type: integer
        text:
          type: string
        type:
          type: string
          enum: [goal, card, substitution, chance, general, kickoff, halftime, fulltime]
      required: [minute, text, type]

    MatchEvent:
      type: object
      properties:
        minute:
          type: integer
        type:
          type: string
          enum: [goal, own_goal, yellow_card, red_card, substitution, penalty]
        clubId:
          type: integer
        playerId:
          type: ["integer", "null"]
        playerName:
          type: string
        assistPlayerId:
          type: ["integer", "null"]
        assistPlayerName:
          type: ["string", "null"]
      required: [minute, type, clubId, playerName]

    MatchStats:
      type: object
      properties:
        homePossession:
          type: integer
        awayPossession:
          type: integer
        homeShots:
          type: integer
        awayShots:
          type: integer
        homeShotsOnTarget:
          type: integer
        awayShotsOnTarget:
          type: integer
        homeCorners:
          type: integer
        awayCorners:
          type: integer
        homeFouls:
          type: integer
        awayFouls:
          type: integer
        homeYellowCards:
          type: integer
        awayYellowCards:
          type: integer
      required: [homePossession, awayPossession, homeShots, awayShots, homeShotsOnTarget, awayShotsOnTarget, homeCorners, awayCorners, homeFouls, awayFouls, homeYellowCards, awayYellowCards]

    FixtureDetail:
      type: object
      properties:
        id:
          type: integer
        week:
          type: integer
        date:
          type: string
        homeClubId:
          type: integer
        homeClubName:
          type: string
        awayClubId:
          type: integer
        awayClubName:
          type: string
        status:
          type: string
          enum: [scheduled, completed, live]
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        isPlayerClubHome:
          type: boolean
        isPlayerClubAway:
          type: boolean
        competition:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/MatchEvent"
        stats:
          $ref: "#/components/schemas/MatchStats"
        commentary:
          type: array
          items:
            $ref: "#/components/schemas/CommentaryLine"
        playerRatings:
          type: array
          items:
            $ref: "#/components/schemas/PlayerMatchRating"
      required: [id, week, date, homeClubId, homeClubName, awayClubId, awayClubName, status, isPlayerClubHome, isPlayerClubAway, competition, events, commentary, playerRatings]

    PlayerMatchRating:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        position:
          type: string
        rating:
          type: number
        goals:
          type: integer
