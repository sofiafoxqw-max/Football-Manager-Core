openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Global Football Capital — multi-player football economy platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: clubs
  - name: leagues
  - name: players
  - name: contracts
  - name: transfers
  - name: economy
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth / Profile ────────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register user (pick role and display name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Leagues ───────────────────────────────────────────────────────────────
  /leagues:
    get:
      operationId: listLeagues
      tags: [leagues]
      summary: List all leagues with entry cost and prize pools
      responses:
        "200":
          description: Leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"

  /leagues/{id}:
    get:
      operationId: getLeague
      tags: [leagues]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: League
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueDetail"

  /leagues/{id}/standings:
    get:
      operationId: getLeagueStandings
      tags: [leagues]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Standings table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StandingRow"

  # ── Clubs ─────────────────────────────────────────────────────────────────
  /clubs:
    get:
      operationId: listClubs
      tags: [clubs]
      summary: Browse all clubs
      parameters:
        - name: leagueId
          in: query
          schema:
            type: integer
        - name: available
          in: query
          description: Only clubs without an owner
          schema:
            type: boolean
      responses:
        "200":
          description: Clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"

  /clubs/{id}:
    get:
      operationId: getClub
      tags: [clubs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"

  /clubs/{id}/buy:
    post:
      operationId: buyClub
      tags: [clubs]
      summary: Owner purchases a club (costs GFC coins)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club acquired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"
        "400":
          description: Insufficient funds or already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clubs/{id}/hire-coach:
    post:
      operationId: hireCoach
      tags: [clubs]
      summary: Owner hires a coach for their club
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HireCoachInput"
      responses:
        "200":
          description: Coach hired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clubs/{id}/fire-coach:
    post:
      operationId: fireCoach
      tags: [clubs]
      summary: Owner fires the current coach (penalty applies)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coach fired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"

  /clubs/{id}/upgrade:
    post:
      operationId: upgradeClub
      tags: [clubs]
      summary: Owner upgrades infrastructure (stadium, academy, training)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeInput"
      responses:
        "200":
          description: Upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clubs/my:
    get:
      operationId: getMyClub
      tags: [clubs]
      summary: Get the club the current user owns or coaches
      responses:
        "200":
          description: My club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetail"
        "404":
          description: No club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Players ───────────────────────────────────────────────────────────────
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: Browse free agents and listed players
      parameters:
        - name: clubId
          in: query
          schema:
            type: integer
        - name: freeAgent
          in: query
          schema:
            type: boolean
        - name: position
          in: query
          schema:
            type: string
        - name: maxAge
          in: query
          schema:
            type: integer
        - name: minOverall
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  # ── Contracts ─────────────────────────────────────────────────────────────
  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List all contracts for my club
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"

  /contracts/coach-offers:
    get:
      operationId: listCoachOffers
      tags: [contracts]
      summary: Coach sees incoming job offers from owners
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachOffer"

  /contracts/coach-offers/{id}/respond:
    post:
      operationId: respondToCoachOffer
      tags: [contracts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferResponseInput"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachOffer"

  /contracts/player:
    post:
      operationId: signPlayerContract
      tags: [contracts]
      summary: Sign a player (coach action)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerContractInput"
      responses:
        "201":
          description: Signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contracts/{id}/terminate:
    post:
      operationId: terminateContract
      tags: [contracts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Terminated (buyout deducted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Transfers ─────────────────────────────────────────────────────────────
  /transfers/market:
    get:
      operationId: getTransferMarket
      tags: [transfers]
      summary: Browse listed players on transfer market
      parameters:
        - name: position
          in: query
          schema:
            type: string
        - name: maxPrice
          in: query
          schema:
            type: integer
        - name: leagueId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Market listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferListing"

  /transfers/bid:
    post:
      operationId: placeBid
      tags: [transfers]
      summary: Coach bids for a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidInput"
      responses:
        "200":
          description: Bid placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferBid"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transfers/list-player:
    post:
      operationId: listPlayerForTransfer
      tags: [transfers]
      summary: Coach lists a player for transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListPlayerInput"
      responses:
        "200":
          description: Listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferListing"

  /transfers/history:
    get:
      operationId: getTransferHistory
      tags: [transfers]
      summary: Recent transfers across all clubs
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferRecord"

  # ── Economy ───────────────────────────────────────────────────────────────
  /economy/summary:
    get:
      operationId: getEconomySummary
      tags: [economy]
      summary: Platform-wide economic snapshot (total money, transactions, tax pool)
      responses:
        "200":
          description: Economy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomySummary"

  /economy/my-finances:
    get:
      operationId: getMyFinances
      tags: [economy]
      summary: Current user's wallet and recent transactions
      responses:
        "200":
          description: Finances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyFinances"

  /economy/transactions:
    get:
      operationId: listTransactions
      tags: [economy]
      summary: My transaction history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Role-aware dashboard — summary stats for owner or coach
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /dashboard/activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [dashboard]
      summary: Top owners by club value, top coaches by win rate
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    # ── Users ───────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [owner, coach, unregistered]
        balance:
          type: integer
          description: GFC coins
        reputation:
          type: integer
        clubId:
          type: ["integer", "null"]
        clubName:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, clerkId, displayName, role, balance, reputation, createdAt]

    RegisterInput:
      type: object
      properties:
        displayName:
          type: string
        role:
          type: string
          enum: [owner, coach]
      required: [displayName, role]

    # ── Leagues ─────────────────────────────────────────────────────────────
    League:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        tier:
          type: integer
        entryFee:
          type: integer
          description: Cost in GFC coins for owner to join
        prizePool:
          type: integer
        totalClubs:
          type: integer
        activeOwners:
          type: integer
      required: [id, name, country, tier, entryFee, prizePool, totalClubs, activeOwners]

    LeagueDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        country:
          type: string
        tier:
          type: integer
        entryFee:
          type: integer
        prizePool:
          type: integer
        season:
          type: integer
        currentWeek:
          type: integer
        totalWeeks:
          type: integer
        clubs:
          type: array
          items:
            $ref: "#/components/schemas/Club"
      required: [id, name, country, tier, entryFee, prizePool, season, currentWeek, totalWeeks, clubs]

    StandingRow:
      type: object
      properties:
        position:
          type: integer
        clubId:
          type: integer
        clubName:
          type: string
        ownerName:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]
        played:
          type: integer
        won:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goalsFor:
          type: integer
        goalsAgainst:
          type: integer
        points:
          type: integer
      required: [position, clubId, clubName, played, won, drawn, lost, goalsFor, goalsAgainst, points]

    # ── Clubs ───────────────────────────────────────────────────────────────
    Club:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        leagueId:
          type: integer
        leagueName:
          type: string
        country:
          type: string
        city:
          type: string
        colors:
          type: string
        purchasePrice:
          type: integer
        currentValue:
          type: integer
        prestige:
          type: integer
        ownerId:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        coachId:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]
        stadiumLevel:
          type: integer
        academyLevel:
          type: integer
        trainingLevel:
          type: integer
        transferBudget:
          type: integer
        weeklyWageBill:
          type: integer
      required: [id, name, leagueId, leagueName, country, city, colors, purchasePrice, currentValue, prestige, stadiumLevel, academyLevel, trainingLevel, transferBudget, weeklyWageBill]

    ClubDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        leagueId:
          type: integer
        leagueName:
          type: string
        country:
          type: string
        city:
          type: string
        colors:
          type: string
        purchasePrice:
          type: integer
        currentValue:
          type: integer
        prestige:
          type: integer
        ownerId:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        coachId:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]
        stadiumLevel:
          type: integer
        academyLevel:
          type: integer
        trainingLevel:
          type: integer
        transferBudget:
          type: integer
        weeklyWageBill:
          type: integer
        stadiumName:
          type: string
        stadiumCapacity:
          type: integer
        description:
          type: string
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        coachSalary:
          type: ["integer", "null"]
        coachContractWeeks:
          type: ["integer", "null"]
      required: [id, name, leagueId, leagueName, country, city, colors, purchasePrice, currentValue, prestige, stadiumLevel, academyLevel, trainingLevel, transferBudget, weeklyWageBill, stadiumName, stadiumCapacity, description, players]

    UpgradeInput:
      type: object
      properties:
        upgradeType:
          type: string
          enum: [stadium, academy, training]
      required: [upgradeType]

    HireCoachInput:
      type: object
      properties:
        coachUserId:
          type: string
        weeklySalary:
          type: integer
        contractWeeks:
          type: integer
        bonusPerWin:
          type: integer
      required: [coachUserId, weeklySalary, contractWeeks, bonusPerWin]

    # ── Players ─────────────────────────────────────────────────────────────
    Player:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        age:
          type: integer
        nationality:
          type: string
        position:
          type: string
        overall:
          type: integer
        potential:
          type: integer
        pace:
          type: integer
        shooting:
          type: integer
        passing:
          type: integer
        dribbling:
          type: integer
        defending:
          type: integer
        physicality:
          type: integer
        value:
          type: integer
        weeklySalary:
          type: integer
        contractEndsWeek:
          type: ["integer", "null"]
        clubId:
          type: ["integer", "null"]
        clubName:
          type: ["string", "null"]
        isOnTransferList:
          type: boolean
        isFreeAgent:
          type: boolean
      required: [id, name, age, nationality, position, overall, potential, pace, shooting, passing, dribbling, defending, physicality, value, weeklySalary, isOnTransferList, isFreeAgent]

    # ── Contracts ───────────────────────────────────────────────────────────
    Contract:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [player, coach]
        playerId:
          type: ["integer", "null"]
        playerName:
          type: ["string", "null"]
        coachId:
          type: ["string", "null"]
        coachName:
          type: ["string", "null"]
        clubId:
          type: integer
        clubName:
          type: string
        weeklySalary:
          type: integer
        startWeek:
          type: integer
        endWeek:
          type: integer
        buyoutClause:
          type: integer
        status:
          type: string
          enum: [active, expired, terminated]
      required: [id, type, clubId, clubName, weeklySalary, startWeek, endWeek, buyoutClause, status]

    PlayerContractInput:
      type: object
      properties:
        playerId:
          type: integer
        weeklySalary:
          type: integer
        contractWeeks:
          type: integer
      required: [playerId, weeklySalary, contractWeeks]

    CoachOffer:
      type: object
      properties:
        id:
          type: integer
        ownerName:
          type: string
        clubId:
          type: integer
        clubName:
          type: string
        leagueName:
          type: string
        weeklySalary:
          type: integer
        contractWeeks:
          type: integer
        bonusPerWin:
          type: integer
        status:
          type: string
          enum: [pending, accepted, rejected]
        createdAt:
          type: string
      required: [id, ownerName, clubId, clubName, leagueName, weeklySalary, contractWeeks, bonusPerWin, status, createdAt]

    OfferResponseInput:
      type: object
      properties:
        accept:
          type: boolean
      required: [accept]

    # ── Transfers ───────────────────────────────────────────────────────────
    TransferListing:
      type: object
      properties:
        id:
          type: integer
        playerId:
          type: integer
        playerName:
          type: string
        position:
          type: string
        overall:
          type: integer
        age:
          type: integer
        fromClubId:
          type: integer
        fromClubName:
          type: string
        askingPrice:
          type: integer
        listedAt:
          type: string
      required: [id, playerId, playerName, position, overall, age, fromClubId, fromClubName, askingPrice, listedAt]

    BidInput:
      type: object
      properties:
        listingId:
          type: integer
        bidAmount:
          type: integer
      required: [listingId, bidAmount]

    TransferBid:
      type: object
      properties:
        id:
          type: integer
        listingId:
          type: integer
        playerName:
          type: string
        bidAmount:
          type: integer
        status:
          type: string
          enum: [pending, accepted, rejected]
        taxAmount:
          type: integer
      required: [id, listingId, playerName, bidAmount, status, taxAmount]

    ListPlayerInput:
      type: object
      properties:
        playerId:
          type: integer
        askingPrice:
          type: integer
      required: [playerId, askingPrice]

    TransferRecord:
      type: object
      properties:
        id:
          type: integer
        playerName:
          type: string
        fromClubName:
          type: string
        toClubName:
          type: string
        fee:
          type: integer
        taxPaid:
          type: integer
        completedAt:
          type: string
      required: [id, playerName, fromClubName, toClubName, fee, taxPaid, completedAt]

    # ── Economy ─────────────────────────────────────────────────────────────
    EconomySummary:
      type: object
      properties:
        totalMoneyInCirculation:
          type: integer
        taxPoolBalance:
          type: integer
        totalTransfersThisSeason:
          type: integer
        totalTransferVolume:
          type: integer
        activeOwners:
          type: integer
        activeCoaches:
          type: integer
        totalClubs:
          type: integer
        taxRate:
          type: number
      required: [totalMoneyInCirculation, taxPoolBalance, totalTransfersThisSeason, totalTransferVolume, activeOwners, activeCoaches, totalClubs, taxRate]

    MyFinances:
      type: object
      properties:
        balance:
          type: integer
        weeklyIncome:
          type: integer
        weeklyExpenses:
          type: integer
        totalEarned:
          type: integer
        totalSpent:
          type: integer
        clubValue:
          type: ["integer", "null"]
        prizeMoneyEarned:
          type: integer
      required: [balance, weeklyIncome, weeklyExpenses, totalEarned, totalSpent, prizeMoneyEarned]

    Transaction:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [transfer_fee, salary, prize_money, club_purchase, upgrade, tax, bonus]
        amount:
          type: integer
        description:
          type: string
        createdAt:
          type: string
      required: [id, type, amount, description, createdAt]

    # ── Dashboard ───────────────────────────────────────────────────────────
    Dashboard:
      type: object
      properties:
        role:
          type: string
          enum: [owner, coach]
        displayName:
          type: string
        balance:
          type: integer
        reputation:
          type: integer
        clubId:
          type: ["integer", "null"]
        clubName:
          type: ["string", "null"]
        leagueName:
          type: ["string", "null"]
        leaguePosition:
          type: ["integer", "null"]
        points:
          type: ["integer", "null"]
        clubValue:
          type: ["integer", "null"]
        transferBudget:
          type: ["integer", "null"]
        squadSize:
          type: ["integer", "null"]
        weeklyWageBill:
          type: ["integer", "null"]
        pendingOffers:
          type: integer
        hasClub:
          type: boolean
      required: [role, displayName, balance, reputation, pendingOffers, hasClub]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [transfer, club_sale, coach_hired, coach_fired, upgrade, match_result]
        description:
          type: string
        involvedClub:
          type: ["string", "null"]
        amount:
          type: ["integer", "null"]
        createdAt:
          type: string
      required: [id, type, description, createdAt]

    Leaderboard:
      type: object
      properties:
        topOwners:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        topCoaches:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required: [topOwners, topCoaches]

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        userId:
          type: string
        displayName:
          type: string
        clubName:
          type: ["string", "null"]
        score:
          type: integer
        scoreLabel:
          type: string
      required: [rank, userId, displayName, score, scoreLabel]
